services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rbac_rag_postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rbac_rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rbac_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
